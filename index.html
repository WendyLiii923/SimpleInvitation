<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>YO & WAYNE｜婚禮</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- 自訂 CSS -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- =========================
       Navbar
  ========================== -->

    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <a class="navbar-brand fw-semibold" href="#home"> YO & WAYNE </a>

        <!-- 手機版選單按鈕 -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="切換選單"
        >
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>

        <!-- 導覽選單 -->
        <div
          class="collapse navbar-collapse justify-content-end"
          id="mainNavbar"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="#home"> 首頁 </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#info"> 婚禮資訊 </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#rsvp"> RSVP </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- =========================
       ① 首頁 / Hero
  ========================== -->

    <section id="home" class="hero-section">
      <div class="container">
        <div class="hero-content text-center">
          <p class="hero-subtitle">WEDDING INVITATION</p>
          <h1>YO & WAYNE</h1>
          <p class="hero-title">我們要結婚了 ♡</p>
          <p class="hero-date">2026 . XX . XX</p>
        </div>
      </div>
    </section>

    <!-- =========================
       ② 婚禮資訊
  ========================== -->

    <section id="info" class="info-section">
      <div class="info-card">
        <div class="info-content">
          <p class="info-subtitle">WEDDING DETAILS</p>

          <h2>婚禮資訊</h2>

          <div class="info-details">
            <p>2026. XX. XX</p>
            <p>午宴 XX : XX</p>
            <p>婚宴會館名稱</p>
            <p>台中市 XXXXX</p>
          </div>

          <a href="#" class="info-map-link" target="_blank">
            查看 Google Maps
          </a>
        </div>

        <div class="info-map-image">
          <img src="images/venue-map.jpg" alt="婚宴會館地圖" />
        </div>
      </div>
    </section>

    <!-- =========================
       ③ RSVP
  ========================== -->

    <section id="rsvp" class="rsvp-section">
      <div class="container py-5">
        <div class="rsvp-card mx-auto">
          <div class="text-center mb-4">
            <h2>出席回函</h2>
          </div>

          <!--
          Google Form 實際送出的位置
          使用 iframe 可以避免跳離目前頁面
        -->

          <iframe
            name="googleFormTarget"
            id="googleFormTarget"
            class="d-none"
          ></iframe>

          <form
            id="rsvpForm"
            action="https://docs.google.com/forms/d/e/1FAIpQLSd5dAWHtvtoc07HkzIewCSDaTZ_zVexVipNYiUG_oX5cvwWlA/formResponse"
            method="POST"
          >
            <!-- 姓名 -->
            <div class="mb-3">
              <label for="name" class="form-label"> 姓名 </label>

              <input
                type="text"
                class="form-control"
                id="name"
                name="entry.1886153940"
                required
              />
            </div>

            <!-- 聯絡電話 -->
            <div class="mb-3">
              <label for="phone" class="form-label"> 聯絡電話 </label>

              <input
                type="tel"
                class="form-control"
                id="phone"
                name="entry.2029074728"
              />
            </div>

            <!-- 與新人關係 -->
            <div class="mb-3">
              <label for="relationship" class="form-label"> 與新人關係 </label>

              <select
                class="form-select"
                id="relationship"
                name="entry.2044940604"
              >
                <option value="" selected disabled>請選擇</option>
                <option value="新郎親戚">新郎親戚</option>
                <option value="新郎朋友">新郎朋友</option>
                <option value="新娘親戚">新娘親戚</option>
                <option value="新娘朋友">新娘朋友</option>
                <option value="新人同事">新人同事</option>
              </select>
            </div>

            <input
              type="hidden"
              id="attendance"
              name="entry.1312972387"
              value="我無法出席，獻上真誠的祝福"
            />

            <!-- 出席意願 -->
            <div class="rsvp-choice">
              <button type="button" id="attendYes" class="rsvp-choice-yes">
                我要參加！
                <span>一起見證幸福時刻</span>
              </button>

              <button type="submit" class="rsvp-choice-no">這次無法參加</button>
            </div>

            <!-- 參加者資料 -->
            <div id="attendDetails" class="d-none">
              <!-- 成人 -->
              <div class="mb-3">
                <label for="adult" class="form-label"> 成人 </label>

                <select
                  class="form-select"
                  id="adult"
                  name="entry.1259066676"
                  value="0"
                >
                  <option value="" selected disabled>請選擇</option>

                  <option value="1">1 人</option>
                  <option value="2">2 人</option>
                  <option value="3">3 人</option>
                  <option value="4">4 人</option>
                  <option value="5">5 人</option>
                  <option value="0" hidden>0 人</option>
                </select>
              </div>

              <!-- 小孩 -->
              <div class="mb-2">
                <label for="child" class="form-label"> 小孩 </label>

                <select class="form-select" id="child" name="entry.1887387302">
                  <option value="0" selected>0 人</option>

                  <option value="1">1 人</option>
                  <option value="2">2 人</option>
                </select>
              </div>

              <!-- 出席人數 -->
              <div class="attendance-total mb-4">
                共
                <span id="people">0</span>
                人出席

                <input
                  type="hidden"
                  id="peopleValue"
                  name="entry.1567260636"
                  value="0"
                />
              </div>

              <!-- 備註 -->
              <div class="mb-4">
                <label for="message" class="form-label"> 備註 </label>

                <textarea
                  class="form-control"
                  id="message"
                  name="entry.845217517"
                  rows="3"
                  placeholder="如有飲食需求或其他事項，歡迎告訴我們"
                ></textarea>
              </div>

              <!-- 參加者送出 -->
              <button type="submit" id="submitBtn" class="rsvp-submit">
                送出 RSVP
              </button>
            </div>
          </form>

          <!-- 成功訊息 -->
          <div id="successMessage" class="text-center d-none">
            <div class="success-icon">✓</div>

            <h2>收到你的 RSVP 了！</h2>

            <p class="text-muted">謝謝你願意來參加我們的婚禮 💕</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 自訂 JS -->
    <script src="./js/script.js"></script>
  </body>
</html>
